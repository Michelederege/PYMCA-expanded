name: package

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: dist\xrfdesk\xrfdesk.exe --bronze --out $env:TEMP\xrfdesk-bronze.csv --workers 1
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('xrfdesk-windows', 'zip', 'dist', 'xrfdesk')"
      - uses: actions/upload-artifact@v4
        with:
          name: xrfdesk-windows
          path: xrfdesk-windows.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries needed to build fisx and open the Qt window offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: QT_QPA_PLATFORM=offscreen ./dist/xrfdesk/xrfdesk --bronze --out /tmp/xrfdesk-bronze.csv --workers 1
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('xrfdesk-linux', 'zip', 'dist', 'xrfdesk')"
      - uses: actions/upload-artifact@v4
        with:
          name: xrfdesk-linux
          path: xrfdesk-linux.zip
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Release notes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - << 'PY'
          import os
          import pathlib
          version = "0"
          for line in pathlib.Path("xrfdesk/__init__.py").read_text(encoding="utf-8").splitlines():
              if line.startswith("__version__"):
                  version = line.split("=", 1)[1].strip().strip('"').strip("'")
          sha = os.environ["RELEASE_SHA"]
          pathlib.Path("release-body.txt").write_text(
              f"version: {version}\nsha: {sha}\n",
              encoding="utf-8",
          )
          PY
      - name: Collect the packages
        run: |
          mkdir -p release
          mv xrfdesk-windows/xrfdesk-windows.zip release/xrfdesk-windows.zip
          mv xrfdesk-linux/xrfdesk-linux.zip release/xrfdesk-linux.zip
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/xrfdesk-windows.zip release/xrfdesk-linux.zip \
            --target "$GITHUB_SHA" \
            --title "Latest xrfdesk" \
            --notes-file release-body.txt \
            --latest
