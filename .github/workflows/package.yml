name: package

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: '& "dist\PyMca Expanded\PyMca Expanded.exe" --bronze --out $env:TEMP\pymca-expanded-bronze.csv --workers 1'
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('pymca-expanded-windows', 'zip', 'dist', 'PyMca Expanded')"
      - uses: actions/upload-artifact@v4
        with:
          name: pymca-expanded-windows
          path: pymca-expanded-windows.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries needed to build fisx and open the Qt window offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: QT_QPA_PLATFORM=offscreen "./dist/PyMca Expanded/PyMca Expanded" --bronze --out /tmp/pymca-expanded-bronze.csv --workers 1
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('pymca-expanded-linux', 'zip', 'dist', 'PyMca Expanded')"
      - uses: actions/upload-artifact@v4
        with:
          name: pymca-expanded-linux
          path: pymca-expanded-linux.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pymca-expanded-*
          path: release-files
      - name: Release notes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - << 'PY'
          import os
          import pathlib
          version = "0"
          for line in pathlib.Path("PyMcaExpanded/__init__.py").read_text(encoding="utf-8").splitlines():
              if line.startswith("__version__"):
                  version = line.split("=", 1)[1].strip().strip('"').strip("'")
          sha = os.environ["RELEASE_SHA"]
          pathlib.Path("release-body.txt").write_text(
              "Unzip the folder and open PyMca Expanded.exe on Windows, or PyMca Expanded on Linux. "
              "Keep every file in the folder. Python is not required.\n"
              f"version: {version}\nsha: {sha}\n",
              encoding="utf-8",
          )
          PY
      - name: Collect the packages
        run: |
          mkdir -p release
          find release-files -name 'pymca-expanded-windows.zip' -exec mv {} release/pymca-expanded-windows.zip \;
          find release-files -name 'pymca-expanded-linux.zip' -exec mv {} release/pymca-expanded-linux.zip \;
          test -f release/pymca-expanded-windows.zip
          test -f release/pymca-expanded-linux.zip
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/pymca-expanded-windows.zip release/pymca-expanded-linux.zip \
            --target "$GITHUB_SHA" \
            --title "PyMca Expanded" \
            --notes-file release-body.txt \
            --latest
