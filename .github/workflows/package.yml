name: package

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: '& "dist\PyMca Expanded\PyMca Expanded.exe" --bronze --out $env:TEMP\pymca-expanded-bronze.csv --workers 1'
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('pymca-expanded-windows', 'zip', 'dist', 'PyMca Expanded')"
      - uses: actions/upload-artifact@v4
        with:
          name: pymca-expanded-windows
          path: pymca-expanded-windows.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries needed to build fisx and open the Qt window offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python build.py
      - name: The program fits the included example
        run: QT_QPA_PLATFORM=offscreen "./dist/PyMca Expanded/PyMca Expanded" --bronze --out /tmp/pymca-expanded-bronze.csv --workers 1
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('pymca-expanded-linux', 'zip', 'dist', 'PyMca Expanded')"
      - uses: actions/upload-artifact@v4
        with:
          name: pymca-expanded-linux
          path: pymca-expanded-linux.zip
          if-no-files-found: error
